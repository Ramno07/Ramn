<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>will you be my valentine?</title>
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet" /> -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff0f5;
        font-family: 'Nunito', sans-serif;
      }

      .box {
        text-align: center;
        background: #ffffff;
        border-radius: 24px;
        padding: 2.5rem 2rem;
        box-shadow: 0 8px 32px rgba(212, 90, 122, 0.12);
        max-width: 420px;
        width: 90%;
      }

      .image {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #f8b4c8;
        margin-bottom: 1.2rem;
      }

      .heading h1 {
        font-family: 'Pacifico', cursive;
        font-size: 1.7rem;
        font-weight: 400;
        color: #d45a7a;
        margin-bottom: 1.6rem;
        line-height: 1.3;
      }

      .buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .yes {
        background: #f06292;
        color: white;
        border: none;
        border-radius: 999px;
        font-family: 'Nunito', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.6em 1.8em;
        cursor: pointer;
        transform-origin: center;
        transition: transform 0.2s ease, font-size 0.2s ease, background 0.15s;
        line-height: 1;
      }

      .yes:hover { background: #e91e8c; }

      .no {
        background: transparent;
        color: #999;
        border: 1px solid #ddd;
        border-radius: 999px;
        font-family: 'Nunito', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.5em 1.3em;
        cursor: pointer;
        transition: font-size 0.2s, opacity 0.2s;
      }

      #message {
        margin-top: 1.2rem;
        font-family: 'Pacifico', cursive;
        font-size: 1rem;
        color: #d45a7a;
        min-height: 1.6rem;
      }

      .heart-particle {
        position: fixed;
        pointer-events: none;
        font-size: 1.5rem;
        animation: floatUp 1.2s ease-out forwards;
        z-index: 999;
      }

      @keyframes floatUp {
        0%   { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-200px) scale(0.3); opacity: 0; }
      }

    </style>
  </head>
  <body>
    <div class="box">
      <img src="images/images.jpg" alt="valentine" class="image" />
      <div class="heading">
        <h1 id="title">will you be my valentine?</h1>
      </div>
      <div class="buttons">
        <a href="thanks.html" class="yes" id="yesBtn" onclick="sayYes()" >YES</a>
        <button class="no"  id="noBtn"  onclick="pressedNo()">NO</button>
      </div>
      <div id="message"></div>
    </div>

    <script>
      var noCount = 0;
      var yesScale = 1;
      var noMessages = [
        "are you sure?? 🥺",
        "please reconsider…",
        "pretty please?? 🙏",
        "i'm getting bigger!",
        "you can't escape 💕",
        "resistance is futile",
        "just click YES already!",
        "ok fine, almost there…",
        "YOU KNOW YOU WANT TO 💘"
      ];

      function pressedNo() {
        noCount++;
        yesScale += 0.22;

        var yes = document.getElementById('yesBtn');
        yes.style.transform = 'scale(' + yesScale + ')';
        yes.style.fontSize = Math.min(1 + noCount * 0.08, 2.2) + 'rem';

        var no = document.getElementById('noBtn');
        no.style.fontSize = Math.max(0.9 - noCount * 0.07, 0.35) + 'rem';
        no.style.opacity = Math.max(1 - noCount * 0.1, 0.2);

        document.getElementById('message').textContent =
          noMessages[Math.min(noCount - 1, noMessages.length - 1)];

        if (noCount >= 10) no.style.display = 'none';
      }

      function sayYes() {
        document.getElementById('title').textContent = 'yay!! 🎉 i knew it!';
        document.getElementById('noBtn').style.display = 'none';
        document.getElementById('message').textContent = '';
        var yes = document.getElementById('yesBtn');
        yes.textContent = '💖 YES!! 💖';
        yes.style.transform = 'scale(1.3)';
        spawnHearts();
      }

      function spawnHearts() {
        var symbols = ['❤️','💕','💗','💓','💖','🌹'];
        for (var i = 0; i < 24; i++) {
          (function(i) {
            setTimeout(function() {
              var el = document.createElement('span');
              el.className = 'heart-particle';
              el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
              el.style.left = Math.random() * 100 + 'vw';
              el.style.top  = (50 + Math.random() * 40) + 'vh';
              el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
              document.body.appendChild(el);
              setTimeout(function() { el.remove(); }, 1300);
            }, i * 60);
          })(i);
        }
      }
    </script>

  </body>
</html>
