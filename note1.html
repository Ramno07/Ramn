<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leave a note</title>
</head>
<body>
    <style>
        body {
            background-color: pink;
        }
        .message {
            text-align: center;
            color: hotpink;
            padding: 15px 32px;
            font-size: 40px;
            font-weight: bold;
            border: none;
            background: none;
        }
        .letter {
            text-align: center;
            color: hotpink;
            font-size: 25px;
            font-weight: bold;
        }
        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            padding: 20px;
            gap: 12px;
        }
        .name {
            padding: 10px;
            border: 2px solid hotpink;
            border-radius: 5px;
            font-size: 16px;
            width: 300px;
        }
        .submit-button {
            background-color: hotpink;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .label {
            color: hotpink;
            font-weight: bold;
            font-size: 14px;
            align-self: flex-start;
            margin-left: calc(50% - 150px);
        }
        .creator {
            text-align: center;
            position: bottom;
            bottom: 20px;
            font-size: 0.9rem;
            color: #d45a7a;
        }
        .creator a {
            color: #d45a7a;
            text-decoration: underline;
            margin: 0 5px;
            text-align: center;
        }
    </style>

    <h1 class="message">💌 Leave a note for your valentine</h1>
    <p class="letter">Write something sweet and let them know who you are!</p>
    

    <form class="form" action="https://formspree.io/f/mbdbozny" method="post">

        <span class="label">Your crush's Instagram 💘</span>
        <input type="text" name="crush_instagram" class="name" placeholder="@Your_Instagram" required>

        <span class="label">Your message 💬</span>
        <input type="text" name="message" class="name" placeholder="Leave me a message..." required>

        <button type="submit" class="submit-button">Send 💌</button>
    </form>
    <div class="creator">
        <p>created by Ramn, creator socials:</p>
        <a href="https://www.instagram.com/_.ramn.__/" target="_blank">Instagram</a>
        <a href="https://github.com/Ramno07?tab=repositories" target="_blank">Github</a>
        <a href="https://snapchat.com/add/ramno07" target="_blank">Snapchat</a>
    </div>
</body>
</html>
